name: 构建与发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v1.2
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 测试、构建并发布 macOS 安装包
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 检出版本源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 检查标签与版本号
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo '版本标签必须为 v主版本.次版本 或 v主版本.次版本.修订号'; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          for plist in Resources/App-Info.plist Resources/Widget-Info.plist; do
            version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")
            test "v$version" = "$RELEASE_TAG" || { echo "标签与 $plist 版本不一致"; exit 1; }
          done
          xcodebuild -version

      - name: 运行测试
        run: ./test.sh

      - name: 构建与验证签名
        run: ./build.sh

      - name: 验证架构并生成发布附件
        shell: bash
        run: |
          set -euo pipefail
          package="BatteryPalette-${RELEASE_TAG}-macOS-universal.zip"
          python3 - <<'PY'
          import os, plistlib, subprocess, tempfile, zipfile
          from pathlib import Path
          with zipfile.ZipFile('build/BatteryPalette.zip') as archive, tempfile.TemporaryDirectory() as temp:
              for root in ['BatteryPalette.app/Contents', 'BatteryPalette.app/Contents/PlugIns/BatteryPaletteWidget.appex/Contents']:
                  info = plistlib.loads(archive.read(root + '/Info.plist'))
                  assert 'v' + info['CFBundleShortVersionString'] == os.environ['RELEASE_TAG']
                  binary = Path(temp) / info['CFBundleExecutable']
                  binary.write_bytes(archive.read(root + '/MacOS/' + info['CFBundleExecutable']))
                  architectures = subprocess.check_output(['lipo', '-archs', str(binary)], text=True).split()
                  assert {'arm64', 'x86_64'} <= set(architectures), architectures
          PY
          cp build/BatteryPalette.zip "build/$package"
          (cd build && shasum -a 256 "$package" > SHA256SUMS.txt)
          echo "RELEASE_PACKAGE=$package" >> "$GITHUB_ENV"

      - name: 生成中文发布说明
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## 功能

          - 菜单栏电量圆环与状态配色，可自定义设备图标。
          - 小、中、大三种桌面及通知中心小组件。
          - 「仅组件」「菜单栏」「桌面浮窗」三种预设。
          - 设备名称、电量百分比开关与开机自启。
          - macOS 26 及以上支持 Liquid Glass。

          ## 下载与安装

          下载并解压 \`$RELEASE_PACKAGE\`，将 BatteryPalette.app 移入 ~/Applications 或 /Applications，只保留一份安装。启动后，在通知中心「编辑小组件」中搜索 Battery Palette。

          支持 macOS 14 及以上，包含 Apple Silicon 与 Intel 架构。在下载目录执行 \`shasum -a 256 -c SHA256SUMS.txt\` 可验证附件。

          ## 已知限制

          - 安装包采用 ad-hoc 本地签名，未进行 Developer ID 签名和公证，macOS 可能阻止直接打开；也可按 README 使用 Xcode 自行构建。
          - 配件电量依赖 macOS 暴露的数据及 IOKit 私有接口，不保证支持所有蓝牙设备。
          - Widget 刷新由系统调度；点击后按唤起时的鼠标位置就近展开面板。
          - 游戏模式检测依赖默认位置安装的 Xcode 提供 gamepolicyctl。

          ## 构建验证

          本安装包由 GitHub Actions 从标签 \`$RELEASE_TAG\` 构建。测试、签名完整性及双架构检查通过后才发布。

          [构建记录](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · MIT 许可证
          EOF

      - name: 上传附件并发布 Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            if python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else 1)' "$RUNNER_TEMP/existing-release.json"; then
              echo '继续上传已有草稿'
            else
              echo '该版本已经发布，保留现有附件，不覆盖'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG · Battery Palette" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "build/$RELEASE_PACKAGE" build/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG · Battery Palette" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest
